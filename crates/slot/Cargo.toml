[package]
name = "slot"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host", "cheevos"]
host = ["dep:winit", "dep:cpal", "dep:gilrs", "slot-gfx/host"]
device = ["slot-gfx/device", "cheevos"]
cheevos = ["dep:slot-cheevos"]

[dependencies]
slot-gfx = { path = "../slot-gfx", default-features = false }
slot-cheevos = { path = "../slot-cheevos", optional = true }
slot-input = { path = "../slot-input" }
slot-power = { path = "../slot-power" }
slot-retro = { path = "../slot-retro" }
slot-store = { path = "../slot-store" }
slot-ui = { path = "../slot-ui" }
winit = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
libloading = { workspace = true }
libc = { workspace = true }
lz4_flex = { workspace = true }
png = { workspace = true }
# Fragile: Game Art (Phase 13): the CRC its databases list, LaunchBox / libretro art,
# and the internet, through the same ureq RetroAchievements uses.
crc32fast = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
slot-gfx = { path = "../slot-gfx", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }
