name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    outputs:
      zip: ${{ steps.package.outputs.zip }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zip, cmake and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Build the tree
        run: task dist:device OUT="slot-${GITHUB_REF_NAME}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          file "$out/System/slot" | grep -q aarch64
          file "$out/System/mgba_libretro.so" | grep -q aarch64
          file "$out/System/gpsp_libretro.so" | grep -q aarch64
          test -x "$out/System/slot"
          gpsp_src_sha="$(cat vendor/gpsp-src.sha)"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.tar.gz"
          test -f "$out/System/licenses/gpsp-${gpsp_src_sha}.meta"
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        id: package
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}"
          zip="$out-h700.zip"
          zip -qry "$zip" "$out"
          cp "$out/System/slot" ./slot
          sha256sum ./slot | cut -d' ' -f1 > ./slot.sha256
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            ${{ steps.package.outputs.zip }}
            slot
            slot.sha256
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          set -eu
          slot_sha="$(cat slot.sha256)"
          cat > notes.md <<NOTES
          ### Over-The-Air (OTA) & Manual Installation

          - **OTA Update**: If your handheld is connected to Wi-Fi, navigate to **Quick Menu > Network > System Update** to download and apply automatically.
          - **Manual Update**: Unzip and copy the contents of \`slot-${GITHUB_REF_NAME}/\` onto SD2.

          #### Checksums
          - \`slot\` SHA-256: \`${slot_sha}\`

          Emulation by mGBA (MPL-2.0), gpSP (GPL-2.0), gambatte (GPL-2.0), and other cores. Licences, patches and corresponding sources are in \`System/licenses/\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" "$ZIP" "slot" "slot.sha256" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md